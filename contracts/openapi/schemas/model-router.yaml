    type: object
    additionalProperties: false
    required:
    - x
    - y
    properties:
      x:
        type: number
        minimum: -100000
        maximum: 100000
      y:
        type: number
        minimum: -100000
        maximum: 100000
  ModelRouterStrategyModel:
