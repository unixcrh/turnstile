        type: integer
        minimum: 1
        maximum: 100
        default: 1
      weight:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      max_latency_ms:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 300000
        default: null
        description: Legacy field name for the candidate invocation timeout. It may
          only tighten the Strategy timeout and is not evaluated after success.
      max_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
        default: null
        description: Static ceiling for the larger input/output list rate per million,
          not an estimated request-cost budget.
      description:
        type: string
        maxLength: 1000
        default: ''
