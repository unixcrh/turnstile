      nodes:
        type: array
        maxItems: 100
        items:
          $ref: ../../openapi.yaml#/components/schemas/ModelRouterNode
        default: []
      edges:
        type: array
        maxItems: 200
        items:
          $ref: ../../openapi.yaml#/components/schemas/ModelRouterEdge
        default: []
  ModelRouterEdge:
    type: object
    additionalProperties: false
    required:
    - id
    - source
    - target
    properties:
      id:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
      source:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
      target:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
