        - string
        - 'null'
        maxLength: 64
        default: null
      label:
        type: string
        maxLength: 120
        default: ''
  ModelRouterNode:
    type: object
    additionalProperties: false
    required:
    - id
    - type
    - label
    - position
    properties:
      id:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
      type:
        type: string
        enum:
        - start
        - condition
        - candidate_models
        - strategy
        - priority
        - fallback
        - output
      label:
        type: string
        minLength: 1
        maxLength: 120
      position:
        $ref: ../../openapi.yaml#/components/schemas/ModelRouterPosition
      condition:
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/ModelRouterCondition
        - type: 'null'
        default: null
      candidates:
        type: array
        maxItems: 50
        items:
          $ref: ../../openapi.yaml#/components/schemas/ModelRouterCandidate
        default: []
      strategy_type:
        type:
        - string
        - 'null'
        enum:
        - priority
        - weighted
        - model_based
        - null
        default: null
      model_configs:
        type: array
        maxItems: 50
        items:
          $ref: ../../openapi.yaml#/components/schemas/ModelRouterStrategyModel
        default: []
      routing_model_id:
        type:
        - string
        - 'null'
        format: uuid
        default: null
      decision_prompt:
        type:
        - string
        - 'null'
        maxLength: 20000
        default: null
        description: Optional model-based system prompt. The {catalog} placeholder
          expands to the authorized candidate catalog.
      max_prompt_chars:
        type: integer
        minimum: 64
        maximum: 50000
        default: 4000
      decision_reasoning_effort:
        type:
        - string
        - 'null'
        enum:
        - none
        - low
        - medium
        - high
        - null
        default: null
      fallback_on:
        type: array
        items:
          type: string
          enum:
          - error
          - timeout
          - rate_limit
          - quality
        default: []
        description: Retry event classes on Fallback nodes. Quality remains readable
          for legacy definitions but validation rejects its publication.
      timeout_ms:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 300000
        default: null
        description: Default candidate invocation timeout on Strategy nodes. Legacy
          Fallback values migrate here while loading.
